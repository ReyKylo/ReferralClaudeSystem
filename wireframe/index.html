<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodePave Referral</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: Asphalt sidebar (paving pattern) + Concrete work area with white 4px cards, dashed "road marking" rules.
   Phone (<760px): sidebar becomes a top bar + scrollable chip nav. Brand: CodePave Brand Guide v1.0. */
:root {
  --asphalt: #0B1F24; --orange: #FF5B1F; --mint: #4FE0C0; --teal: #14564F; --concrete: #E8EBE9; --cone-deep: #C8410B; --cone-tint: #FFE4D6;
  --bg: #EFF1F0; --surface: #FFFFFF; --surface-2: #F5F6F5; --text: #0B1F24; --text-2: #46575B; --text-3: #6E7E81;
  --line: #C3CAC8; --line-soft: #DDE2E0; --pattern: rgba(11, 31, 36, 0.045);
  --nav-bg: #0B1F24; --nav-fg: #FFFFFF; --nav-fg-2: #9DB3B3; --nav-hover: rgba(255, 255, 255, 0.07);
  --accent: #FF5B1F; --on-accent: #0B1F24; --link: #C8410B;
  --btn-2-bg: #0B1F24; --btn-2-fg: #FFFFFF;
  --head-bg: #0B1F24; --head-fg: #FFFFFF;
  --ok-bg: #D5F5EC; --ok-fg: #14564F; --ok-dot: #14564F;
  --warn-bg: #FFE4D6; --warn-fg: #A3360A; --warn-dot: #FF5B1F;
  --bad-bg: #FBE4E1; --bad-fg: #A3201A; --bad-dot: #D0342A;
  --neu-bg: #E3E7E5; --neu-fg: #3D4B4F; --neu-dot: #7E8C8F;
  --note-bg: #FFE4D6; --focus: #FF5B1F; --scrim: rgba(11, 31, 36, 0.4);
  --font: "Overpass", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Overpass Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B1F24; --surface: #112B31; --surface-2: #15333A; --text: #FFFFFF; --text-2: #AFC2C2; --text-3: #849A9A;
    --line: rgba(255, 255, 255, 0.2); --line-soft: rgba(255, 255, 255, 0.1); --pattern: rgba(255, 255, 255, 0.025);
    --nav-bg: #061418; --nav-fg-2: #8FA7A7; --link: #FF7A45;
    --btn-2-bg: #FFFFFF; --btn-2-fg: #0B1F24; --head-bg: #14564F; --head-fg: #FFFFFF;
    --ok-bg: rgba(79, 224, 192, 0.14); --ok-fg: #4FE0C0; --ok-dot: #4FE0C0;
    --warn-bg: rgba(255, 91, 31, 0.16); --warn-fg: #FF9B6E; --warn-dot: #FF5B1F;
    --bad-bg: rgba(255, 110, 100, 0.15); --bad-fg: #FF928A; --bad-dot: #FF6B61;
    --neu-bg: rgba(255, 255, 255, 0.08); --neu-fg: #C8D5D5; --neu-dot: #8FA7A7;
    --note-bg: rgba(255, 91, 31, 0.12); --scrim: rgba(0, 0, 0, 0.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1F24; --surface: #112B31; --surface-2: #15333A; --text: #FFFFFF; --text-2: #AFC2C2; --text-3: #849A9A;
  --line: rgba(255, 255, 255, 0.2); --line-soft: rgba(255, 255, 255, 0.1); --pattern: rgba(255, 255, 255, 0.025);
  --nav-bg: #061418; --nav-fg-2: #8FA7A7; --link: #FF7A45;
  --btn-2-bg: #FFFFFF; --btn-2-fg: #0B1F24; --head-bg: #14564F; --head-fg: #FFFFFF;
  --ok-bg: rgba(79, 224, 192, 0.14); --ok-fg: #4FE0C0; --ok-dot: #4FE0C0;
  --warn-bg: rgba(255, 91, 31, 0.16); --warn-fg: #FF9B6E; --warn-dot: #FF5B1F;
  --bad-bg: rgba(255, 110, 100, 0.15); --bad-fg: #FF928A; --bad-dot: #FF6B61;
  --neu-bg: rgba(255, 255, 255, 0.08); --neu-fg: #C8D5D5; --neu-dot: #8FA7A7;
  --note-bg: rgba(255, 91, 31, 0.12); --scrim: rgba(0, 0, 0, 0.55);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

/* ---- shell */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side {
  background-color: var(--nav-bg); color: var(--nav-fg); position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 20px; padding: 22px 14px max(18px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  background-image:
    linear-gradient(rgba(255,255,255,.035) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,255,255,.035) 2px, transparent 2px);
  background-size: 64px 20px, 64px 40px; background-position: 0 0, 32px 0;
}
.side .logo { width: 150px; height: auto; color: var(--nav-fg); display: block; margin-left: 6px; }
.side .product { font: 700 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--nav-fg-2); margin: 8px 0 0 7px; }
.role { display: grid; gap: 6px; }
.role label { font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--nav-fg-2); padding-left: 7px; }
.role select { background: rgba(255,255,255,.06); color: var(--nav-fg); border: 1px solid rgba(255,255,255,.16); border-radius: var(--r); padding: 8px 10px; }
.role select option { color: #0B1F24; background: #fff; }
.nav { display: grid; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; color: var(--nav-fg-2);
  padding: 9px 10px; border-radius: var(--r); cursor: pointer; font-weight: 600;
}
.nav button:hover { background: var(--nav-hover); color: var(--nav-fg); }
.nav button[aria-current="page"] { background: rgba(255,255,255,.1); color: var(--nav-fg); }
.nav button[aria-current="page"] .blk { background: var(--orange); }
.nav .blk { width: 12px; height: 7px; border-radius: 1.5px; background: rgba(255,255,255,.28); flex: none; }
.nav .count { margin-left: auto; font: 700 11px/1 var(--mono); background: var(--orange); color: var(--asphalt); padding: 4px 6px 3px; border-radius: 3px; }
.nav .count.quiet { background: rgba(255,255,255,.14); color: var(--nav-fg); }
.side-foot { margin-top: auto; font: 400 12px/1.5 var(--font); color: var(--nav-fg-2); padding: 0 7px; }
.side-foot b { color: var(--nav-fg); font-weight: 600; }

.main { min-width: 0; padding-block: 26px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); position: relative; }
.main::after { /* faint paving in the bottom-right corner, per the brand's inner-page standard */
  content: ""; position: fixed; right: 0; bottom: 0; width: 360px; height: 220px; pointer-events: none; z-index: 0;
  background-image: linear-gradient(var(--pattern) 3px, transparent 3px), linear-gradient(90deg, var(--pattern) 3px, transparent 3px);
  background-size: 72px 24px, 72px 48px; background-position: 0 0, 36px 0;
  -webkit-mask-image: linear-gradient(135deg, transparent 35%, #000); mask-image: linear-gradient(135deg, transparent 35%, #000);
}
.main > * { position: relative; z-index: 1; }
.wrap { max-width: 1180px; display: grid; gap: 20px; }
.topbar { display: none; }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; justify-content: space-between; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; background: var(--asphalt); color: #fff; border-radius: var(--r); padding: 4px 10px 3px 4px; font: 700 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.eyebrow i { font-style: normal; background: var(--orange); color: var(--asphalt); border-radius: 2px; padding: 4px 6px 3px; }
.head h1 { font-size: 1.6rem; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em; margin-top: 10px; }
.head p { margin: 4px 0 0; color: var(--text-2); max-width: 64ch; }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---- controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 7px 14px 6px; border-radius: var(--r); border: 1px solid transparent; font-weight: 800; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn-1 { background: var(--accent); color: var(--on-accent); }
.btn-1:hover { filter: brightness(1.05); }
.btn-2 { background: var(--btn-2-bg); color: var(--btn-2-fg); }
.btn-3 { background: var(--surface); color: var(--text); border-color: var(--line); }
.btn-3:hover { border-color: var(--text-3); }
.btn-sm { min-height: 30px; padding: 4px 10px 3px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.wa { background: #E2F7EC; color: #0E5A32; border-color: #B7E7CB; }
:root[data-theme="dark"] .wa { background: rgba(37, 211, 102, .14); color: #7BE3A4; border-color: rgba(37, 211, 102, .3); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wa { background: rgba(37, 211, 102, .14); color: #7BE3A4; border-color: rgba(37, 211, 102, .3); } }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font: 700 11px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
.input, select.input, textarea.input { width: 100%; min-height: 38px; padding: 8px 10px 7px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
textarea.input { min-height: 70px; resize: vertical; }
.input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--text-2); }
.check input { margin-top: 3px; accent-color: var(--orange); width: 16px; height: 16px; flex: none; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px dashed var(--line); background: var(--surface); padding: 5px 10px 4px; border-radius: var(--r); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-2); }
.seg button[aria-pressed="true"] { border-style: solid; border-color: var(--asphalt); background: var(--asphalt); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #fff; color: var(--asphalt); border-color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: #fff; color: var(--asphalt); border-color: #fff; } }

/* ---- cards, badges */
.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); min-width: 0; }
.card-pad { padding: 18px; }
.card h2 { font-size: 1.05rem; font-weight: 800; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px dashed var(--line); }
.label { font: 700 11px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 2px; border-radius: 3px; font: 700 11px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 1px; background: currentColor; }
.b-ok { background: var(--ok-bg); color: var(--ok-fg); } .b-ok::before { background: var(--ok-dot); }
.b-warn { background: var(--warn-bg); color: var(--warn-fg); } .b-warn::before { background: var(--warn-dot); }
.b-bad { background: var(--bad-bg); color: var(--bad-fg); } .b-bad::before { background: var(--bad-dot); }
.b-neu { background: var(--neu-bg); color: var(--neu-fg); } .b-neu::before { background: var(--neu-dot); }
.note { background: var(--note-bg); border-left: 4px solid var(--asphalt); border-radius: 0 var(--r) var(--r) 0; padding: 12px 14px; position: relative; font-size: 14px; }
.note::after { content: ""; position: absolute; left: -4px; bottom: 0; width: 4px; height: 38%; background: var(--orange); }
:root[data-theme="dark"] .note { border-left-color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .note { border-left-color: #fff; } }
.muted { color: var(--text-2); }
.small { font-size: 13px; }
.grid { display: grid; gap: 14px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.split { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); align-items: start; }

/* KPI tiles: staggered like a brick course */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px 16px 12px; display: grid; gap: 2px; position: relative; overflow: hidden; }
.kpi:nth-child(even) { transform: translateY(10px); }
.kpi .v { font-size: 2rem; line-height: 1.1; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kpi .s { font-size: 12.5px; color: var(--text-2); }
.kpi.hi::after { content: ""; position: absolute; top: 0; right: 0; width: 34px; height: 6px; background: var(--orange); border-radius: 0 0 0 2px; }
.kpi.okk::after { content: ""; position: absolute; top: 0; right: 0; width: 34px; height: 6px; background: var(--mint); }
.progress { display: grid; gap: 8px; }
.bar { height: 14px; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 3px; display: flex; overflow: hidden; }
.bar > span { display: block; height: 100%; }
.bar .p-done { background: var(--teal); } .bar .p-conf { background: var(--mint); } .bar .p-pend { background: var(--orange); } .bar .p-bad { background: repeating-linear-gradient(135deg, var(--bad-dot) 0 4px, transparent 4px 8px); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--text-2); }
.legend i { display: inline-block; width: 12px; height: 8px; border-radius: 1.5px; margin-right: 6px; vertical-align: 1px; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th { background: var(--head-bg); color: var(--head-fg); text-align: left; font: 700 11px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 10px 12px 9px; white-space: nowrap; }
tbody td { padding: 10px 12px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.sel td { background: var(--note-bg); }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }
.who { display: grid; line-height: 1.3; } .who b { font-weight: 600; } .who small { color: var(--text-3); font-size: 12.5px; }

/* filters */
.filters { display: grid; grid-template-columns: minmax(200px, 2fr) repeat(4, minmax(130px, 1fr)); gap: 10px; padding: 14px 18px; border-bottom: 1px dashed var(--line); }
.bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 18px; background: var(--note-bg); border-bottom: 1px dashed var(--line); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 14px 18px 18px; }
.cal .dow { font: 700 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); padding: 0 2px 4px; }
.day { min-height: 86px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface); padding: 7px 8px; display: grid; align-content: space-between; gap: 4px; text-align: left; cursor: pointer; }
.day:hover { border-style: solid; }
.day.out { opacity: .35; cursor: default; }
.day.past { background: var(--surface-2); }
.day[aria-pressed="true"] { border: 2px solid var(--orange); padding: 6px 7px; }
.day .dn { display: flex; justify-content: space-between; font: 700 12px/1 var(--mono); }
.day.is-today .dn > span:first-child { background: var(--orange); color: var(--asphalt); border-radius: 2px; padding: 3px 5px 2px; margin: -3px 0 0 -3px; }
.day .fill { font-weight: 900; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.day .fill small { font-weight: 400; color: var(--text-3); font-size: 12px; }
.day .mini { height: 5px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.day .mini span { display: block; height: 100%; }
.st-planned .mini span { background: var(--teal); } .st-incomplete .mini span { background: var(--orange); }
.st-planned { border-color: var(--ok-dot); }
.cal-legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 18px 16px; font-size: 12.5px; color: var(--text-2); }

/* lists */
.list { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 12px 18px; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.row .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--text-2); }
.h1-row { grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); }
.row.stack { grid-template-columns: minmax(0, 1fr); }
.row.stack .head-actions::before { content: "Pindah ke"; font: 700 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.h1-actions { display: grid; gap: 8px; justify-items: end; }
.h1-actions .line { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.empty { padding: 28px 18px; text-align: center; color: var(--text-2); }

/* wallet */
.wallet { display: grid; grid-template-columns: minmax(0, 1.3fr) repeat(4, minmax(0, 1fr)); gap: 0; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line-soft); }
.wallet > div { padding: 16px 18px; background: var(--surface); border-right: 1px dashed var(--line); display: grid; gap: 2px; }
.wallet > div:last-child { border-right: 0; }
.wallet .main-bal { background: var(--asphalt); color: #fff; border-right: 0; }
.wallet .main-bal .label { color: var(--mint); }
.wallet .v { font-size: 1.35rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.wallet .main-bal .v { font-size: 2rem; }
.wallet .main-bal .muted { color: #AFC2C2; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button { border: 1px dashed var(--line); background: var(--surface); padding: 9px 14px 8px; border-radius: var(--r); font-weight: 800; cursor: pointer; font-variant-numeric: tabular-nums; }
.presets button[aria-pressed="true"] { border: 1px solid var(--orange); background: var(--orange); color: var(--asphalt); }
.presets button:disabled { opacity: .4; cursor: not-allowed; }

/* drawer + toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--bg); z-index: 41; overflow-y: auto; border-left: 1px solid var(--line-soft);
  padding: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) 20px; display: grid; gap: 16px; align-content: start; }
.drawer-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.timeline { display: grid; gap: 0; }
.timeline div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.timeline div:last-child { border-bottom: 0; }
.timeline time { font: 600 12px/1.5 var(--mono); color: var(--text-3); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); z-index: 60;
  background: var(--asphalt); color: #fff; border-radius: var(--r); padding: 11px 16px 10px; font-weight: 600; font-size: 14px; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.toast::before { content: ""; width: 12px; height: 7px; border-radius: 1.5px; background: var(--mint); flex: none; }
.toast.err::before { background: var(--orange); }
.proto { font: 600 12px/1.4 var(--font); color: var(--text-3); }

/* ---- phone */
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { display: grid; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--nav-bg); color: var(--nav-fg);
    padding-block: 12px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--nav-bg); }
  .topbar .t1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .topbar .logo { width: 118px; height: auto; color: var(--nav-fg); }

(() => {
'use strict';
// ---------------------------------------------------------------- dates (WIB)
const pad = (n) => String(n).padStart(2, '0');
const TODAY = (() => { const d = new Date(Date.now() + 7 * 3600e3); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; })();
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diff = (a, b) => Math.round((new Date(a + 'T00:00:00Z') - new Date(b + 'T00:00:00Z')) / 864e5);
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const BULAN_PANJANG = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const dow = (iso) => new Date(iso + 'T00:00:00Z').getUTCDay();
const fmtD = (iso) => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${BULAN[m - 1]}`; };
const fmtDL = (iso) => `${HARI[dow(iso)]}, ${fmtD(iso)}`;

// ---------------------------------------------------------------- rules (mirror of the SQL functions)
function dayStats(day) {
  const ents = E.filter((e) => e.day === day && (e.state === 'active' || e.state === 'completed'));
  const target = day in TARGETS ? TARGETS[day] : S.dailyTarget;
  const scheduled = ents.length;
  const confirmed = ents.filter((e) => e.conf === 'available').length;
  const pending = ents.filter((e) => e.state === 'active' && ['not_contacted', 'contacted', 'waiting'].includes(e.conf)).length;
  const unavailable = ents.filter((e) => e.state === 'active' && ['unavailable', 'reschedule'].includes(e.conf)).length;
  const completed = ents.filter((e) => e.state === 'completed').length;
  const remaining = Math.max(target - (scheduled - unavailable), 0);
  const status = target === 0 ? 'off' : scheduled === 0 ? 'not_planned' : scheduled - unavailable >= target ? 'planned' : 'incomplete';
  return { day, target, scheduled, confirmed, pending, unavailable, completed, remaining, status, ents };
}
function wallet(refId) {
  const cs = C.filter((c) => c.ref === refId), ws = W.filter((w) => w.ref === refId);
  const sum = (a) => a.reduce((s, x) => s + x.amount, 0);
  const approved = sum(cs.filter((c) => c.status === 'approved'));
  const onHold = sum(ws.filter((w) => w.status === 'requested' || w.status === 'approved'));
  const withdrawn = sum(ws.filter((w) => w.status === 'paid'));
  return { total: sum(cs.filter((c) => c.status !== 'void')), pending: sum(cs.filter((c) => c.status === 'pending')), approved, onHold, withdrawn, available: approved - onHold - withdrawn };
}
const fail = (msg) => { throw new Error(msg); };
function submitParticipant(refId, f) {
  if (!f.name.trim()) fail('Isi nama peserta');
  const wa = normWa(f.wa); if (wa.length < 10 || wa.length > 15) fail('Nomor WhatsApp belum benar');

  if (!f.consent) fail('Peserta harus setuju dihubungi lewat WhatsApp');
  if (f.availDate && f.availDate < TODAY) fail('Tanggal ketersediaan sudah lewat');
  if (P.some((p) => p.status !== 'rejected' && normWa(p.wa) === wa)) fail('Nomor WhatsApp ini sudah terdaftar');
  if (P.some((p) => p.status !== 'rejected' && p.email.toLowerCase() === f.email.trim().toLowerCase())) fail('Email ini sudah terdaftar');
  const p = mk('submitted', TODAY, refId);
  Object.assign(p, { name: f.name.trim(), wa: f.wa.trim(), email: f.email.trim().toLowerCase(), cloud: f.cloud.trim(), availDate: f.availDate || null, availTime: f.availTime || null, notes: f.notes.trim() });
  pushN('admin', `Peserta baru dari ${refName(refId)}: ${p.name}`);
  pushN(refId, `Pendaftaran ${p.name} terkirim`);
  return p;
}
function review(ids, action, reason) {
  const to = { review: 'under_review', approve: 'approved', reject: 'rejected' }[action];
  if (to === 'rejected' && !reason?.trim()) fail('Isi alasan penolakan');
  let n = 0;
  ids.map(pById).forEach((p) => {
    const okFrom = ['submitted', 'under_review'].includes(p.status) || (to === 'rejected' && ['approved', 'waiting_schedule'].includes(p.status));
    if (!okFrom) return;
    p.status = to; if (to === 'rejected') p.reason = reason.trim();
    ev(p, TODAY, to === 'approved' ? 'Disetujui admin' : to === 'rejected' ? 'Ditolak: ' + reason.trim() : 'Mulai direview');
    if (to !== 'under_review') pushN(p.ref, `Pendaftaran ${p.name} ${to === 'approved' ? 'disetujui' : 'ditolak'}`);
    n++;
  });
  return n;
}
function schedule(day, ids, time, allowOver) {
  if (day < TODAY) fail('Tanggal sudah lewat');
  const snap = JSON.stringify(E);
  let fresh = 0, moved = 0;
  for (const p of ids.map(pById)) {
    if (!['approved', 'waiting_schedule', 'scheduled', 'confirmation_pending', 'confirmed'].includes(p.status)) fail(`${p.name} belum disetujui atau sudah selesai`);
    const old = activeEntry(p.id);
    if (old && old.day === day) { if (time) old.time = time; continue; }
    if (old) old.state = 'moved';
    const e = { id: 'e' + eseq++, pid: p.id, day, time: time || p.availTime, state: 'active', conf: 'not_contacted' };
    E.push(e); if (old) { old.movedTo = e.id; moved++; } else fresh++;
    p.status = 'scheduled';
  }
  const st = dayStats(day);
  if (st.scheduled - st.unavailable > st.target && !allowOver) {
    E.length = 0; JSON.parse(snap).forEach((x) => E.push(x));
    ids.map(pById).forEach((p) => { const a = activeEntry(p.id); p.status = a ? p.status : p.status; });
    fail(`Kapasitas ${fmtD(day)} tinggal ${dayStats(day).remaining} dari target ${st.target}`);
  }
  ids.map(pById).forEach((p) => { const e = activeEntry(p.id); ev(p, TODAY, `Dijadwalkan ${fmtD(e.day)} jam ${e.time || '-'}`); pushN(p.ref, `Jadwal ${p.name}: ${fmtDL(e.day)} jam ${e.time || '-'}`); });
  return { fresh, moved };
}
function unschedule(eid) {

  if (d.wpaid) { const v = document.querySelector(`[data-wref="${d.wpaid}"]`).value; run(() => markPaid(d.wpaid, v), 'Ditandai dibayar'); return; }
  if (d.amt) { st.wAmount = Number(d.amt); st.wCustom = ''; render(); return; }
  if (t.id === 'w-req') { const amt = st.wCustom ? Number(String(st.wCustom).replace(/\D/g, '')) : st.wAmount; run(() => requestWithdrawal(ME, amt), `Pencairan ${rp(amt)} diajukan. Saldo ditahan sampai diproses`); return; }
  if (d.wcancel) { run(() => { const w = W.find((x) => x.id === d.wcancel); if (w.status !== 'requested') fail('Permintaan tidak bisa dibatalkan'); w.status = 'cancelled'; }, 'Permintaan dibatalkan, saldo kembali tersedia'); return; }
  if (t.id === 'readAll') { const to = st.role === 'referral' ? ME : 'admin'; N.filter((n) => n.to === to).forEach((n) => (n.read = true)); render(); return; }
  if (d.rpt) { st.rptDays = Number(d.rpt); render(); return; }
  if (t.id === 'csv') {
    const rows = [['tanggal', 'target', 'terjadwal', 'terkonfirmasi', 'tidak_bisa', 'selesai'], ...Array.from({ length: st.rptDays }, (_, i) => dayStats(addDays(TODAY, -st.rptDays + 1 + i))).map((s) => [s.day, s.target, s.scheduled, s.confirmed, s.unavailable, s.completed])];
    const csv = rows.map((r) => r.join(',')).join('\n');
    navigator.clipboard?.writeText(csv).then(() => toast('CSV disalin, tempel ke spreadsheet'), () => toast('Tidak bisa menyalin otomatis di sini', true)) ?? toast('Tidak bisa menyalin otomatis di sini', true);
  }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'q') { st.q = t.value; st.sel.clear(); render(true); }
  if (t.id === 'w-custom') { st.wCustom = t.value.replace(/[^\d]/g, ''); render(true); }
  if (t.id === 'readyTime') st.readyTime = t.value;
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (['fStatus', 'fRef', 'fConf', 'fDay'].includes(t.id)) { st[t.id] = t.value; st.sel.clear(); render(); }
  if (t.dataset.moveto && t.value) { const pid = t.dataset.moveto, day = t.value; run(() => schedule(day, [pid], null, false), `Dipindah ke ${fmtDL(day)}`); }
});
document.addEventListener('submit', (ev) => {
  if (ev.target.id !== 'regForm') return;
  ev.preventDefault();
  const again = ev.submitter?.dataset.again === '1';
  const v = (id) => document.getElementById(id).value;
  try {
    const p = submitParticipant(ME, { name: v('f-name'), wa: v('f-wa'), email: v('f-email'), cloud: v('f-cloud'), availDate: v('f-date'), availTime: v('f-time'), notes: v('f-notes'), consent: document.getElementById('f-consent').checked });
    if (again) { render(); toast(`${p.name} terkirim. Isi peserta berikutnya`); document.getElementById('f-name').focus(); }
    else { st.view = 'peserta'; render(); toast(`${p.name} terkirim, menunggu review`); }
  } catch (e) { toast(e.message, true); }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && st.drawer) { st.drawer = null; paintOverlay(); } });
render();
})();
</script>
</html>
