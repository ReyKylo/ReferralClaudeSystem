<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodePave Referral</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: Asphalt sidebar on desktop; on the phone a top bar and, for referrals, a 4-item bottom tab bar (Android).
   Brand: CodePave Brand Guide v1.0 (Asphalt, Cone Orange, Signal Mint, Overpass). Tokens: see DESIGN.md. */
:root {
  --asphalt: #0B1F24; --orange: #FF5B1F; --mint: #4FE0C0; --teal: #14564F;
  --bg: #EFF1F0; --surface: #FFFFFF; --surface-2: #F5F6F5; --text: #0B1F24; --text-2: #46575B; --text-3: #5C6B6E;
  --line: #C3CAC8; --line-soft: #DDE2E0; --line-strong: #7E8C8F; --pattern: rgba(11, 31, 36, 0.045);
  --nav-bg: #0B1F24; --nav-fg: #FFFFFF; --nav-fg-2: #A9BDBD; --nav-hover: rgba(255, 255, 255, 0.07);
  --accent: #FF5B1F; --on-accent: #0B1F24; --link: #B8400E;
  --btn-2-bg: #0B1F24; --btn-2-fg: #FFFFFF; --head-bg: #0B1F24; --head-fg: #FFFFFF;
  --done: #0B1F24; --todo: #DDE2E0;
  --ok-bg: #D5F5EC; --ok-fg: #14564F; --ok-dot: #14564F;
  --warn-bg: #FFE4D6; --warn-fg: #A3360A; --warn-dot: #FF5B1F;
  --bad-bg: #FBE4E1; --bad-fg: #A3201A; --bad-dot: #D0342A;
  --neu-bg: #E3E7E5; --neu-fg: #3D4B4F; --neu-dot: #6E7E81;
  --tint: #FFE4D6; --wa-bg: #E2F7EC; --wa-fg: #0E5A32; --wa-line: #B7E7CB;
  --focus: #FF5B1F; --scrim: rgba(11, 31, 36, 0.4);
  --font: "Overpass", "Segoe UI", system-ui, sans-serif;
  --mono: "Overpass Mono", ui-monospace, Menlo, Consolas, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 48px;
  --r: 4px; --r-in: 2px;
  --t-hero: 32px; --t-title: 20px; --t-body: 16px; --t-meta: 14px; --t-small: 12px;
  --tap: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B1F24; --surface: #112B31; --surface-2: #15333A; --text: #FFFFFF; --text-2: #B9CACA; --text-3: #9AAFAF;
    --line: rgba(255, 255, 255, 0.22); --line-soft: rgba(255, 255, 255, 0.1); --line-strong: rgba(255, 255, 255, 0.45); --pattern: rgba(255, 255, 255, 0.025);
    --nav-bg: #061418; --nav-fg-2: #9AAFAF; --link: #FF8A57;
    --btn-2-bg: #FFFFFF; --btn-2-fg: #0B1F24; --head-bg: #14564F; --done: #FFFFFF; --todo: rgba(255, 255, 255, 0.14);
    --ok-bg: rgba(79, 224, 192, 0.14); --ok-fg: #4FE0C0; --ok-dot: #4FE0C0;
    --warn-bg: rgba(255, 91, 31, 0.16); --warn-fg: #FFA27A; --warn-dot: #FF5B1F;
    --bad-bg: rgba(255, 110, 100, 0.15); --bad-fg: #FF9A92; --bad-dot: #FF6B61;
    --neu-bg: rgba(255, 255, 255, 0.08); --neu-fg: #C8D5D5; --neu-dot: #9AAFAF;
    --tint: rgba(255, 91, 31, 0.13); --wa-bg: rgba(37, 211, 102, 0.14); --wa-fg: #7BE3A4; --wa-line: rgba(37, 211, 102, 0.3);
    --scrim: rgba(0, 0, 0, 0.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1F24; --surface: #112B31; --surface-2: #15333A; --text: #FFFFFF; --text-2: #B9CACA; --text-3: #9AAFAF;
  --line: rgba(255, 255, 255, 0.22); --line-soft: rgba(255, 255, 255, 0.1); --line-strong: rgba(255, 255, 255, 0.45); --pattern: rgba(255, 255, 255, 0.025);
  --nav-bg: #061418; --nav-fg-2: #9AAFAF; --link: #FF8A57;
  --btn-2-bg: #FFFFFF; --btn-2-fg: #0B1F24; --head-bg: #14564F; --done: #FFFFFF; --todo: rgba(255, 255, 255, 0.14);
  --ok-bg: rgba(79, 224, 192, 0.14); --ok-fg: #4FE0C0; --ok-dot: #4FE0C0;
  --warn-bg: rgba(255, 91, 31, 0.16); --warn-fg: #FFA27A; --warn-dot: #FF5B1F;
  --bad-bg: rgba(255, 110, 100, 0.15); --bad-fg: #FF9A92; --bad-dot: #FF6B61;
  --neu-bg: rgba(255, 255, 255, 0.08); --neu-fg: #C8D5D5; --neu-dot: #9AAFAF;
  --tint: rgba(255, 91, 31, 0.13); --wa-bg: rgba(37, 211, 102, 0.14); --wa-fg: #7BE3A4; --wa-line: rgba(37, 211, 102, 0.3);
  --scrim: rgba(0, 0, 0, 0.55);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--t-body)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 600; }
h1 { font-size: var(--t-title); line-height: 1.3; }
h2 { font-size: var(--t-body); line-height: 1.4; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: var(--t-meta); }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico-lg { width: 24px; height: 24px; }
.muted { color: var(--text-2); }
.meta-t { font-size: var(--t-meta); color: var(--text-2); }
a { color: var(--link); }

/* ---- shell */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background-color: var(--nav-bg); color: var(--nav-fg); position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: var(--s6); padding: var(--s6) var(--s4) max(var(--s5), env(safe-area-inset-bottom, 0px)) max(var(--s4), env(safe-area-inset-left, 0px));
  background-image: linear-gradient(rgba(255,255,255,.03) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.03) 2px, transparent 2px); /* deslop-ignore: paving pattern from the brand guide, not a colour sweep */
  background-size: 64px 20px, 64px 40px; background-position: 0 0, 32px 0; }
.side .logo { width: 148px; height: auto; color: var(--nav-fg); display: block; }
.side .product { font-size: var(--t-meta); color: var(--nav-fg-2); margin-top: var(--s2); }
.role { display: grid; gap: var(--s2); }
.role label { font-size: var(--t-small); color: var(--nav-fg-2); }
.role select { background: rgba(255,255,255,.06); color: var(--nav-fg); border: 1px solid rgba(255,255,255,.18); border-radius: var(--r); padding: var(--s2) var(--s3); min-height: 40px; font-size: var(--t-meta); }
.role select option { color: #0B1F24; background: #fff; }
.nav { display: grid; gap: var(--s1); }
.nav button { display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left; border: 0; background: none; color: var(--nav-fg-2);
  min-height: 44px; padding: 0 var(--s3); border-radius: var(--r); cursor: pointer; font-weight: 600; position: relative; }
.nav button:hover { background: var(--nav-hover); color: var(--nav-fg); }
.nav button[aria-current="page"] { background: rgba(255,255,255,.1); color: var(--nav-fg); }
.nav button[aria-current="page"] .ico { color: var(--orange); }
.nav .count { margin-left: auto; font-size: var(--t-small); font-weight: 600; background: var(--orange); color: var(--asphalt); padding: 2px var(--s2); border-radius: var(--r-in); }
.side-foot { margin-top: auto; font-size: var(--t-small); line-height: 1.5; color: var(--nav-fg-2); }
.side-foot b { color: var(--nav-fg); font-weight: 600; }

.main { min-width: 0; padding-block: var(--s7) var(--s8); padding-left: max(var(--s7), env(safe-area-inset-left, 0px)); padding-right: max(var(--s7), env(safe-area-inset-right, 0px)); position: relative; }
.main::after { content: ""; position: fixed; right: 0; bottom: 0; width: 360px; height: 220px; pointer-events: none; z-index: 0;
  background-image: linear-gradient(var(--pattern) 3px, transparent 3px), linear-gradient(90deg, var(--pattern) 3px, transparent 3px); /* deslop-ignore: brand paving pattern */
  background-size: 72px 24px, 72px 48px; background-position: 0 0, 36px 0;
  -webkit-mask-image: linear-gradient(135deg, transparent 35%, #000); mask-image: linear-gradient(135deg, transparent 35%, #000); /* deslop-ignore: fade mask for the pattern */ }
.main > * { position: relative; z-index: 1; }
.wrap { max-width: 1180px; display: grid; gap: var(--s5); }
.wrap.narrow { max-width: 640px; }
.topbar, .tabs { display: none; }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s3) var(--s5); justify-content: space-between; }
.head p { margin-top: var(--s1); color: var(--text-2); max-width: 64ch; }
.head-actions { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }

/* ---- controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 44px; padding: 0 var(--s5); border-radius: var(--r); border: 1px solid transparent;
  font-weight: 600; font-size: var(--t-body); cursor: pointer; white-space: nowrap; text-decoration: none; line-height: 1.2; }
.btn-1 { background: var(--accent); color: var(--on-accent); }
.btn-1:hover { background: #FF6D36; }
.btn-2 { background: var(--btn-2-bg); color: var(--btn-2-fg); }
.btn-3 { background: var(--surface); color: var(--text); border-color: var(--line-strong); }
.btn-3:hover { border-color: var(--text-3); }
.btn-link { background: none; border: 0; color: var(--link); padding: 0 var(--s1); min-height: var(--tap); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: var(--s1); }
.btn-sm { min-height: 40px; padding: 0 var(--s3); font-size: var(--t-meta); }
.btn-block { width: 100%; min-height: var(--tap); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.wa { background: var(--wa-bg); color: var(--wa-fg); border-color: var(--wa-line); }
.field { display: grid; gap: var(--s2); min-width: 0; }
.field > span:first-child { font-size: var(--t-meta); font-weight: 600; color: var(--text); }
.field .opt { font-weight: 400; color: var(--text-2); }
.help { font-size: var(--t-meta); color: var(--text-2); }
.help.ok { color: var(--ok-fg); } .help.bad { color: var(--bad-fg); }
.input, select.input, textarea.input { width: 100%; min-height: var(--tap); padding: var(--s3); border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); font-size: var(--t-body); }
textarea.input { min-height: 88px; resize: vertical; }
.input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
.input[aria-invalid="true"] { border: 2px solid var(--bad-dot); }
.input[aria-invalid="true"]:focus { outline-color: var(--bad-dot); }
.pw { display: flex; gap: var(--s2); }
.check { display: flex; gap: var(--s3); align-items: flex-start; font-size: var(--t-body); padding: var(--s3); border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); cursor: pointer; }
.check input { margin-top: var(--s1); accent-color: var(--orange); width: 20px; height: 20px; flex: none; }
.check[aria-invalid="true"] { border: 2px solid var(--bad-dot); }
.seg { display: inline-flex; flex-wrap: wrap; gap: var(--s1); }
.seg button { border: 1px dashed var(--line); background: var(--surface); min-height: 40px; padding: 0 var(--s3); border-radius: var(--r); font-size: var(--t-meta); font-weight: 600; cursor: pointer; color: var(--text-2); }
.seg button[aria-pressed="true"] { border-style: solid; border-color: var(--btn-2-bg); background: var(--btn-2-bg); color: var(--btn-2-fg); }
.seg.full { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); }
.seg.full button { min-height: 44px; font-size: var(--t-body); }
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip { border: 1px solid var(--line-strong); background: var(--surface); min-height: 44px; padding: 0 var(--s4); border-radius: var(--r); font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--btn-2-bg); background: var(--btn-2-bg); color: var(--btn-2-fg); }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.chip small { font-weight: 400; color: inherit; opacity: .8; margin-left: var(--s1); font-size: var(--t-meta); }
details.more { border: 1px dashed var(--line); border-radius: var(--r); }
details.more summary { min-height: var(--tap); padding: 0 var(--s3); display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 600; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "Buka"; font-weight: 400; color: var(--link); font-size: var(--t-meta); }
details.more[open] summary::after { content: "Tutup"; }
details.more > div { padding: 0 var(--s3) var(--s3); display: grid; gap: var(--s4); }

/* ---- cards, badges */
.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); min-width: 0; }
.card-pad { padding: var(--s5); }
.card-head { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; justify-content: space-between; padding: var(--s4) var(--s5); border-bottom: 1px dashed var(--line); }
.label { font-size: var(--t-meta); color: var(--text-2); }
.badge { display: inline-flex; align-items: center; gap: var(--s2); padding: 2px var(--s2); border-radius: var(--r-in); font-size: var(--t-meta); font-weight: 600; line-height: 1.5; white-space: nowrap; }
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 1px; background: currentColor; flex: none; }
.b-ok { background: var(--ok-bg); color: var(--ok-fg); } .b-ok::before { background: var(--ok-dot); }
.b-warn { background: var(--warn-bg); color: var(--warn-fg); } .b-warn::before { background: var(--warn-dot); }
.b-bad { background: var(--bad-bg); color: var(--bad-fg); } .b-bad::before { background: var(--bad-dot); }
.b-neu { background: var(--neu-bg); color: var(--neu-fg); } .b-neu::before { background: var(--neu-dot); }
.note { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r); padding: var(--s3) var(--s4); font-size: var(--t-meta); }
.note.ic { display: flex; gap: var(--s3); align-items: flex-start; }
.note .ico { margin-top: 2px; color: var(--text-2); }
.note.err { background: var(--bad-bg); border-color: transparent; color: var(--bad-fg); }
.note.err .ico { color: var(--bad-fg); }
.offline { background: var(--asphalt); color: #fff; border-radius: var(--r); padding: var(--s3) var(--s4); font-size: var(--t-meta); }
.grid { display: grid; gap: var(--s4); }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.split { display: grid; gap: var(--s5); grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); align-items: start; }

/* signature: the paving road. 4 blocks; done = asphalt, current = Cone Orange (the AI block), to do = empty */
.road { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s1); }
.road i { display: block; height: 8px; border-radius: var(--r-in); background: var(--todo); }
.road i.done { background: var(--done); } .road i.now { background: var(--orange); }
.road.bad i.now { background: var(--bad-dot); }
.road-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s1); margin-top: var(--s2); font-size: var(--t-small); color: var(--text-2); }
.road-steps span.now { color: var(--text); font-weight: 600; }

/* KPI tiles (ERP) */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: var(--s3); }
.kpi { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); padding: var(--s4); display: grid; gap: var(--s1); position: relative; overflow: hidden; }
.kpi .v { font-size: var(--t-hero); line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: var(--t-meta); color: var(--text-2); }
.progress { display: grid; gap: var(--s2); }
.bar { height: 16px; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-in); display: flex; overflow: hidden; }
.bar > span { display: block; height: 100%; }
.bar .p-done { background: var(--teal); } .bar .p-conf { background: var(--mint); } .bar .p-pend { background: var(--orange); }
.bar .p-bad { background: repeating-linear-gradient(135deg, var(--bad-dot) 0 4px, transparent 4px 8px); } /* deslop-ignore: stripes so "tidak bisa" is not colour-only */
.legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); font-size: var(--t-meta); color: var(--text-2); }
.legend i { display: inline-block; width: 12px; height: 8px; border-radius: var(--r-in); margin-right: var(--s2); }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--t-meta); }
thead th { background: var(--head-bg); color: var(--head-fg); text-align: left; font-weight: 600; padding: var(--s3); white-space: nowrap; }
tbody td { padding: var(--s3); border-bottom: 1px dashed var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.sel td { background: var(--tint); }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }
.who { display: grid; line-height: 1.4; } .who b { font-weight: 600; } .who small { color: var(--text-2); font-size: var(--t-meta); }

.filters { display: grid; grid-template-columns: minmax(200px, 2fr) repeat(4, minmax(128px, 1fr)); gap: var(--s3); padding: var(--s4) var(--s5); border-bottom: 1px dashed var(--line); }
.bulk { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; padding: var(--s3) var(--s5); background: var(--tint); border-bottom: 1px dashed var(--line); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--s2); padding: var(--s4) var(--s5) var(--s5); }
.cal .dow { font-size: var(--t-small); color: var(--text-2); padding: 0 var(--s1) var(--s1); }
.day { min-height: 88px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface); padding: var(--s2); display: grid; align-content: space-between; gap: var(--s1); text-align: left; cursor: pointer; }
.day:hover { border-style: solid; }
.day.out { opacity: .35; cursor: default; }
.day.past { background: var(--surface-2); }
.day[aria-pressed="true"] { outline: 2px solid var(--orange); outline-offset: -1px; }
.day .dn { font-size: var(--t-small); font-weight: 600; }
.day.is-today .dn span { background: var(--orange); color: var(--asphalt); border-radius: var(--r-in); padding: 2px var(--s1); }
.day .fill { font-weight: 600; font-size: var(--t-body); font-variant-numeric: tabular-nums; }
.day .fill small { font-weight: 400; color: var(--text-2); font-size: var(--t-small); }
.day .mini { height: 4px; background: var(--surface-2); border-radius: var(--r-in); overflow: hidden; }
.day .mini span { display: block; height: 100%; }
.st-planned .mini span { background: var(--teal); } .st-incomplete .mini span { background: var(--orange); }
.st-planned { border-color: var(--ok-dot); }
.cal-legend { display: flex; gap: var(--s3); flex-wrap: wrap; padding: 0 var(--s5) var(--s4); }

/* lists */
.list { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s2) var(--s4); align-items: center; padding: var(--s3) var(--s5); border-bottom: 1px dashed var(--line); min-height: 64px; }
.row:last-child { border-bottom: 0; }
button.row, a.row { width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; cursor: pointer; color: inherit; font: inherit; text-decoration: none; }
button.row:hover, a.row:hover { background: var(--surface-2); }
.row .meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); align-items: center; font-size: var(--t-meta); color: var(--text-2); }
.row .go { color: var(--text-3); }
.row.stack { grid-template-columns: minmax(0, 1fr); }
.h1-row { grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); }
.h1-actions { display: grid; gap: var(--s2); justify-items: end; }
.h1-actions .line { display: flex; flex-wrap: wrap; gap: var(--s2); justify-content: flex-end; align-items: center; }
.empty { padding: var(--s7) var(--s5); text-align: center; color: var(--text-2); display: grid; gap: var(--s3); justify-items: center; }
.empty .ico { width: 32px; height: 32px; color: var(--text-3); }

/* money */
.money { display: grid; gap: var(--s1); }

<script>

(() => {
'use strict';
// ---------------------------------------------------------------- dates (WIB)
const pad = (n) => String(n).padStart(2, '0');
const TODAY = (() => { const d = new Date(Date.now() + 7 * 3600e3); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; })();
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diff = (a, b) => Math.round((new Date(a + 'T00:00:00Z') - new Date(b + 'T00:00:00Z')) / 864e5);
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const BULAN_PANJANG = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const dow = (iso) => new Date(iso + 'T00:00:00Z').getUTCDay();
const fmtD = (iso) => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${BULAN[m - 1]}`; };
const fmtDL = (iso) => `${HARI[dow(iso)]}, ${fmtD(iso)}`;
const rel = (iso) => { const n = diff(iso, TODAY); return n === 0 ? 'Hari ini' : n === 1 ? 'Besok' : n === -1 ? 'Kemarin' : fmtDL(iso); };
const rp = (n) => 'Rp' + Math.round(n).toLocaleString('id-ID');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normWa = (raw) => { const d = String(raw || '').replace(/\D/g, ''); return !d ? '' : d.startsWith('0') ? '62' + d.slice(1) : d.startsWith('8') ? '62' + d : d; };

// ---------------------------------------------------------------- settings (ref.settings)
const S = { adminWa: '0812-9000-1000', dailyTarget: 20, commission: 50000, presets: [100000, 200000, 300000, 500000], withdrawMin: 50000,
  waTemplate: 'Halo {name}, kami dari tim Claude Kita. Mau memastikan jadwal Anda besok, {date} jam {time}. Apakah Anda tersedia? Balas YA atau TIDAK. Terima kasih.' };

// ---------------------------------------------------------------- sample data
const REF = [
  { id: 'r1', name: 'Gipong', username: 'gipong', pw: 'demo1234', wa: '0812-1111-1111', payout: { method: 'BCA', account: '1234567890', name: 'Gipong Saputra' } },
  { id: 'r2', name: 'Zakar', username: 'zakar', pw: 'demo1234', wa: '0812-2222-2222', payout: { method: 'DANA', account: '0812-2222-2222', name: 'Zakar Hidayat' } },
  { id: 'r3', name: 'Rina', username: 'rina', pw: 'demo1234', wa: '0812-3333-3333', payout: null },
];
const FIRST = ['Andi', 'Budi', 'Citra', 'Dewi', 'Eka', 'Fajar', 'Gita', 'Hendra', 'Indah', 'Joko', 'Kartika', 'Lukman', 'Maya', 'Nanda', 'Oki', 'Putri', 'Rizky', 'Sari', 'Teguh', 'Umar', 'Vina', 'Wahyu', 'Yoga', 'Zahra', 'Agus', 'Bayu', 'Dian', 'Fitri', 'Galih', 'Hana', 'Irfan', 'Jihan', 'Kevin', 'Laras', 'Made', 'Nia', 'Rangga', 'Siska', 'Tomi', 'Wulan'];
const LAST = ['Pratama', 'Santoso', 'Lestari', 'Wijaya', 'Kusuma', 'Saputra', 'Rahma', 'Nugroho', 'Permata', 'Hakim', 'Utami', 'Setiawan', 'Anggraini', 'Firmansyah'];
const P = [], E = [], C = [], W = [], N = [], NOTES = [];
let seq = 0, eseq = 0;
const ev = (p, at, text) => p.events.push({ at, text });
function mk(status, enteredOn, refId) {
  const i = seq++;
  const name = `${FIRST[i % FIRST.length]} ${LAST[(i * 7) % LAST.length]}`;
  const p = { id: 'p' + i, ref: refId || REF[i % 7 < 3 ? 0 : i % 7 < 6 ? 1 : 2].id, name,
    wa: `0813-${pad(40 + (i % 50))}${pad(i % 97)}-${String(1000 + i * 37).slice(-4)}`, email: `${name.toLowerCase().replace(' ', '.')}${i}@gmail.com`,
    cloud: `CK-${2000 + i}`, availDate: null, availTime: ['09:00', '10:00', '13:00', '15:00', '19:00'][i % 5], notes: '', consent: true,
    status, reason: '', enteredOn, events: [] };
  ev(p, enteredOn, 'Dikirim oleh ' + REF.find((r) => r.id === p.ref).name);
  P.push(p); return p;
}
function book(p, day, conf, state = 'active') {
  const e = { id: 'e' + eseq++, pid: p.id, day, time: p.availTime, state, conf };
  E.push(e); ev(p, addDays(day, -3), `Dijadwalkan ${fmtD(day)} jam ${p.availTime}`); return e;
}
// history: last 10 days fully done
for (let d = -10; d <= -1; d++) {
  const day = addDays(TODAY, d), n = [18, 20, 17, 20, 19, 20, 16, 20, 20, 18][d + 10];
  for (let k = 0; k < n; k++) {
    const p = mk('completed', addDays(day, -5 - (k % 3)));
    book(p, day, 'available', 'completed');
    C.push({ id: 'c' + p.id, ref: p.ref, pid: p.id, amount: S.commission, status: d <= -3 ? 'approved' : 'pending', at: day });
  }
  if (d === -6) { const p = mk('waiting_schedule', addDays(day, -6)); const e = book(p, day, 'reschedule', 'moved'); e.state = 'moved'; }
}
// today: 20 booked → 15 available, 3 pending, 2 unavailable (PRD example)
const todayConf = [...Array(15).fill('available'), 'not_contacted', 'contacted', 'waiting', 'unavailable', 'reschedule'];
todayConf.forEach((c, k) => { const p = mk(c === 'available' ? 'confirmed' : c === 'not_contacted' ? 'scheduled' : (c === 'unavailable' || c === 'reschedule') ? 'waiting_schedule' : 'confirmation_pending', addDays(TODAY, -4 - (k % 3))); book(p, TODAY, c); });
// tomorrow: 20 booked, H-1 in progress
const tmConf = [...Array(8).fill('available'), ...Array(4).fill('waiting'), ...Array(3).fill('contacted'), ...Array(4).fill('not_contacted'), 'unavailable'];
tmConf.forEach((c, k) => { const p = mk(c === 'available' ? 'confirmed' : c === 'not_contacted' ? 'scheduled' : c === 'unavailable' ? 'waiting_schedule' : 'confirmation_pending', addDays(TODAY, -3 - (k % 2))); book(p, addDays(TODAY, 1), c); });
// +2: 15, +3: 10, +4: none
for (let k = 0; k < 15; k++) book(mk('scheduled', addDays(TODAY, -2)), addDays(TODAY, 2), 'not_contacted');
for (let k = 0; k < 10; k++) book(mk('scheduled', addDays(TODAY, -1)), addDays(TODAY, 3), 'not_contacted');
// waiting room
for (let k = 0; k < 7; k++) { const p = mk('approved', addDays(TODAY, -1)); p.availDate = addDays(TODAY, 3 + (k % 3)); ev(p, addDays(TODAY, -1), 'Disetujui admin'); }
for (let k = 0; k < 4; k++) mk('submitted', TODAY);
for (let k = 0; k < 2; k++) { const p = mk('under_review', addDays(TODAY, -1)); ev(p, TODAY, 'Mulai direview'); }
for (let k = 0; k < 3; k++) { const p = mk('rejected', addDays(TODAY, -2)); p.reason = 'Nomor WhatsApp tidak aktif'; ev(p, addDays(TODAY, -1), 'Ditolak: Nomor WhatsApp tidak aktif'); }
const TARGETS = { [addDays(TODAY, 6)]: 0 }; // e.g. a day off
W.push({ id: 'w1', ref: 'r1', amount: 300000, status: 'paid', at: addDays(TODAY, -6), paidAt: addDays(TODAY, -5), reference: 'BCA 0611 TRX 88210', payout: REF[0].payout });
W.push({ id: 'w2', ref: 'r1', amount: 200000, status: 'requested', at: addDays(TODAY, -1), payout: REF[0].payout });
W.push({ id: 'w3', ref: 'r2', amount: 500000, status: 'approved', at: addDays(TODAY, -2), payout: REF[1].payout });
const pushN = (to, text, at = TODAY, pid = null) => N.unshift({ to, text, at, read: false, pid });
pushN('admin', 'Permintaan tarik saldo Rp200.000 dari Gipong', addDays(TODAY, -1));
pushN('admin', '4 peserta baru menunggu review');
pushN('admin', `Target ${fmtD(addDays(TODAY, 2))} dan ${fmtD(addDays(TODAY, 3))} belum terpenuhi`);
pushN('r1', 'Komisi Rp50.000 dari Andi Pratama masuk saldo', addDays(TODAY, -2));
pushN('r1', 'Tarik saldo Rp300.000 sudah ditransfer. Buktinya ada di menu Saldo.', addDays(TODAY, -5));
pushN('r1', '3 peserta Anda dijadwalkan besok', addDays(TODAY, -1));
NOTES.push({ pid: E.find((e) => e.day === TODAY && e.conf === 'unavailable').pid, text: 'Ada acara keluarga, minta minggu depan', at: TODAY });

const pById = (id) => P.find((p) => p.id === id);
const refName = (id) => REF.find((r) => r.id === id)?.name ?? '-';
const activeEntry = (pid) => E.find((e) => e.pid === pid && e.state === 'active');
const latestEntry = (pid) => activeEntry(pid) || E.filter((e) => e.pid === pid && e.state === 'completed').sort((a, b) => b.day.localeCompare(a.day))[0];

// ---------------------------------------------------------------- rules (mirror of the SQL functions)
function dayStats(day) {
  const ents = E.filter((e) => e.day === day && (e.state === 'active' || e.state === 'completed'));
  const target = day in TARGETS ? TARGETS[day] : S.dailyTarget;
  const scheduled = ents.length;
  const confirmed = ents.filter((e) => e.conf === 'available').length;
  const pending = ents.filter((e) => e.state === 'active' && ['not_contacted', 'contacted', 'waiting'].includes(e.conf)).length;
  const unavailable = ents.filter((e) => e.state === 'active' && ['unavailable', 'reschedule'].includes(e.conf)).length;
  const completed = ents.filter((e) => e.state === 'completed').length;
  const remaining = Math.max(target - (scheduled - unavailable), 0);
  const status = target === 0 ? 'off' : scheduled === 0 ? 'not_planned' : scheduled - unavailable >= target ? 'planned' : 'incomplete';
  return { day, target, scheduled, confirmed, pending, unavailable, completed, remaining, status, ents };
}
function wallet(refId) {
  const cs = C.filter((c) => c.ref === refId), ws = W.filter((w) => w.ref === refId);
  const sum = (a) => a.reduce((s, x) => s + x.amount, 0);
  const approved = sum(cs.filter((c) => c.status === 'approved'));
  const onHold = sum(ws.filter((w) => w.status === 'requested' || w.status === 'approved'));
  const withdrawn = sum(ws.filter((w) => w.status === 'paid'));
  return { total: sum(cs.filter((c) => c.status !== 'void')), pending: sum(cs.filter((c) => c.status === 'pending')), approved, onHold, withdrawn, available: approved - onHold - withdrawn };
}
const fail = (msg) => { throw new Error(msg); };
function submitParticipant(refId, f) {
  if (!f.name.trim()) fail('Isi nama peserta');
  const wa = normWa(f.wa); if (wa.length < 10 || wa.length > 15) fail('Nomor WhatsApp belum benar');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) fail('Email belum benar');
  if (!f.consent) fail('Peserta harus setuju dihubungi lewat WhatsApp');
  if (f.availDate && f.availDate < TODAY) fail('Tanggal ketersediaan sudah lewat');
  if (P.some((p) => p.status !== 'rejected' && normWa(p.wa) === wa)) fail('Nomor WhatsApp ini sudah terdaftar');
  if (P.some((p) => p.status !== 'rejected' && p.email.toLowerCase() === f.email.trim().toLowerCase())) fail('Email ini sudah terdaftar');
  const p = mk('submitted', TODAY, refId);
  Object.assign(p, { name: f.name.trim(), wa: f.wa.trim(), email: f.email.trim().toLowerCase(), cloud: f.cloud.trim(), availDate: f.availDate || null, availTime: f.availTime || null, notes: f.notes.trim() });
  pushN('admin', `Peserta baru dari ${refName(refId)}: ${p.name}`, TODAY, p.id);
  pushN(refId, `Pendaftaran ${p.name} terkirim. Tim akan mengeceknya.`, TODAY, p.id);
  return p;
}
function review(ids, action, reason) {
  const to = { review: 'under_review', approve: 'approved', reject: 'rejected' }[action];
  if (to === 'rejected' && !reason?.trim()) fail('Tulis alasan penolakan dulu. Referral akan membacanya.');
  let n = 0;
  ids.map(pById).forEach((p) => {
    const okFrom = ['submitted', 'under_review'].includes(p.status) || (to === 'rejected' && ['approved', 'waiting_schedule'].includes(p.status));
    if (!okFrom) return;
    p.status = to; if (to === 'rejected') p.reason = reason.trim();
    ev(p, TODAY, to === 'approved' ? 'Disetujui admin' : to === 'rejected' ? 'Ditolak: ' + reason.trim() : 'Mulai direview');
    if (to !== 'under_review') pushN(p.ref, to === 'approved' ? `${p.name} diterima. Tim sedang mencarikan jadwal.` : `${p.name} ditolak: ${reason.trim()}`, TODAY, p.id);
    n++;
  });
  return n;
}
function schedule(day, ids, time, allowOver) {
  if (day < TODAY) fail('Tanggal sudah lewat');
  const snap = JSON.stringify(E);
  let fresh = 0, moved = 0;
  for (const p of ids.map(pById)) {
    if (!['approved', 'waiting_schedule', 'scheduled', 'confirmation_pending', 'confirmed'].includes(p.status)) fail(`${p.name} belum disetujui atau sudah selesai`);
    const old = activeEntry(p.id);
    if (old && old.day === day) { if (time) old.time = time; continue; }
    if (old) old.state = 'moved';
    const e = { id: 'e' + eseq++, pid: p.id, day, time: time || p.availTime, state: 'active', conf: 'not_contacted' };

}
